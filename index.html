<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Seedream 工作台</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --sub:#9aa3b2;
    --accent:#6c8cff; --ok:#3ecf8e; --warn:#f5a524; --err:#ff5c7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
  main{max-width:760px;margin:0 auto;padding:12px}
  h1{font-size:20px;margin:8px 4px 12px}
  h1 small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .grow{flex:1}
  label{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
  input,select,textarea{width:100%;background:#0c0e12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 > div{min-width:0}
  .hint{font-size:12px;color:var(--sub);margin-top:6px}
  button{background:#232835;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;font-family:inherit}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.danger{color:var(--err)}
  button.small{padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .big{width:100%;padding:14px;font-size:17px;margin-top:12px}
  details summary{cursor:pointer;color:var(--sub);font-size:13px}
  .refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
  .ref{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid transparent;background:#0c0e12}
  .ref img{width:100%;height:100%;object-fit:cover;display:block}
  .ref.sel{border-color:var(--accent)}
  .ref:not(.sel) img{opacity:.45}
  .ref .badge{position:absolute;left:4px;top:4px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:0 6px}
  .ref .del{position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.65);border:none;color:#fff;padding:0;font-size:14px;line-height:24px}
  .ref.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);color:var(--sub);font-size:28px}
  .tasks .t{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .tasks .t:first-child{border-top:none}
  .tasks .t .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .dot{width:8px;height:8px;border-radius:4px;flex:none}
  .s-queued .dot{background:var(--sub)} .s-running .dot{background:var(--accent);animation:pulse 1s infinite}
  .s-interrupted .dot{background:var(--warn)} .s-failed .dot{background:var(--err)}
  @keyframes pulse{50%{opacity:.3}}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .gallery img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;display:block;background:#0c0e12}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px)}
  .viewer.show{display:flex}
  .viewer .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 0}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default}
  .viewer .meta{font-size:12px;color:var(--sub);max-height:22vh;overflow:auto;white-space:pre-wrap;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#2b3140;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .pill{font-size:12px;color:var(--sub);font-weight:400}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
  .switch input{width:auto}
</style>
</head>
<body>
<main>
  <h1>Seedream 工作台 <small>v2 · OpenRouter</small></h1>

  <!-- API Key -->
  <div class="card">
    <details id="keyBox">
      <summary>🔑 OpenRouter API Key（只存在本机）</summary>
      <div style="margin-top:10px">
        <input id="apiKey" type="password" placeholder="sk-or-v1-..." autocomplete="off">
        <div class="hint">Key 只保存在这台手机的浏览器里，不会上传到别处。</div>
      </div>
    </details>
  </div>

  <!-- 参数 -->
  <div class="card">
    <h2>⚙️ 参数</h2>
    <div class="grid2">
      <div>
        <label>模型</label>
        <select id="model"></select>
      </div>
      <div>
        <label>构图比例</label>
        <select id="aspect"></select>
      </div>
      <div>
        <label>分辨率</label>
        <select id="resolution"></select>
      </div>
      <div>
        <label>输出格式</label>
        <select id="format"></select>
      </div>
      <div>
        <label>背景</label>
        <select id="background">
          <option value="auto">auto 自动</option>
          <option value="opaque">opaque 不透明</option>
          <option value="transparent">transparent 透明（PNG）</option>
        </select>
      </div>
      <div>
        <label>种子 Seed（留空=随机）</label>
        <input id="seed" type="number" inputmode="numeric" placeholder="随机">
      </div>
      <div>
        <label>生成张数</label>
        <input id="count" type="number" inputmode="numeric" min="1" max="50" value="1">
      </div>
      <div>
        <label>同时请求数</label>
        <select id="concurrency">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option>
        </select>
      </div>
    </div>
    <div class="hint" id="modelHint"></div>
    <div class="row" style="margin-top:10px">
      <label class="switch"><input type="checkbox" id="autoRetry" checked> 切回页面时自动重发被中断的任务</label>
    </div>
  </div>

  <!-- 参考图 -->
  <div class="card">
    <h2><span class="grow">🖼️ 参考图 <span class="pill" id="refCount"></span></span>
      <button class="small" id="refNone">全不选</button>
    </h2>
    <div class="refs" id="refs"></div>
    <input id="refFile" type="file" accept="image/*" multiple hidden>
    <div class="hint">参考图会一直保存在本机。点图片 = 选中/取消，角标数字就是提示词里的“图1、图2…”。</div>
  </div>

  <!-- 提示词 -->
  <div class="card">
    <h2>✍️ 提示词</h2>
    <textarea id="prompt" placeholder="描述你想要的画面…"></textarea>
    <button class="primary big" id="go">生成</button>
  </div>

  <!-- 任务 -->
  <div class="card" id="taskCard" hidden>
    <h2><span class="grow">⏳ 任务</span>
      <button class="small" id="retryAll">全部重发</button>
      <button class="small danger" id="clearTasks">清除失败</button>
    </h2>
    <div class="tasks" id="tasks"></div>
  </div>

  <!-- 图库 -->
  <div class="card">
    <h2><span class="grow">📁 图库 <span class="pill" id="galCount"></span></span></h2>
    <div class="row" style="margin-bottom:10px">
      <button class="primary" id="zipAll">⬇️ 一键打包下载全部</button>
      <button class="danger" id="clearGal">清空图库</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>
</main>

<div class="viewer" id="viewer">
  <div class="imgwrap"><img id="vImg" alt=""></div>
  <div class="meta" id="vMeta"></div>
  <div class="row">
    <button id="vShare">存到相册/分享</button>
    <button id="vDl">下载</button>
    <button id="vRef">设为参考图</button>
    <button class="danger" id="vDel">删除</button>
    <button id="vClose" style="margin-left:auto">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(async () => {
'use strict';

/* ================== 配置 ================== */
const API = 'https://openrouter.ai/api/v1/images';
// 数据来自 OpenRouter 图像模型接口 /api/v1/images/models（2026-11）
const MODELS = {
  'bytedance-seed/seedream-5-5':       { label:'Seedream 5.5（新）', res:['1K','1.5K','2K'], fmt:['png','jpeg'], bg:true,  maxRefs:10 },
  'bytedance-seed/seedream-5-0-pro':   { label:'Seedream 5.0 Pro',   res:['1K','2K'],        fmt:['png','jpeg'], bg:true,  maxRefs:14 },
  'bytedance-seed/seedream-5-0-flash': { label:'Seedream 5.0 Flash', res:['1K','2K'],        fmt:['png','jpeg'], bg:true,  maxRefs:14 },
  'bytedance-seed/seedream-5-0-lite':  { label:'Seedream 5.0 Lite',  res:['2K','4K'],        fmt:['png','jpeg'], bg:false, maxRefs:14 },
  'bytedance-seed/seedream-4.5':       { label:'Seedream 4.5',       res:['1K','2K','4K'],   fmt:null,           bg:false, maxRefs:14 },
};
const RATIOS = [
  ['9:19.5','9:19.5 手机全面屏（默认）'],['9:20','9:20'],['9:21','9:21'],['9:16','9:16 竖屏'],
  ['1:2','1:2'],['2:3','2:3'],['3:4','3:4'],['4:5','4:5'],['1:1','1:1 方图'],
  ['5:4','5:4'],['4:3','4:3'],['3:2','3:2'],['2:1','2:1'],['16:9','16:9 横屏'],
  ['19.5:9','19.5:9'],['20:9','20:9'],['21:9','21:9'],['auto','auto（模型自己决定）'],
];
const DEFAULTS = { model:'bytedance-seed/seedream-5-5', aspect:'9:19.5', resolution:'2K', format:'png',
  background:'auto', seed:'', count:1, concurrency:3, autoRetry:true, prompt:'' };
const REQ_TIMEOUT = 240000;   // 单次请求最长等 4 分钟
const STALE_MS    = 150000;   // 切回来时，已跑超过 2.5 分钟的请求视为丢了，自动重发
const MAX_AUTO    = 4;        // 自动重发最多次数

/* ================== 小工具 ================== */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg, ms = 2200){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), ms); }
class ApiError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function b64ToBlob(b64, mime){ return (await fetch(`data:${mime};base64,${b64}`)).blob(); }
function extOf(mime){ return /png/.test(mime) ? 'png' : /webp/.test(mime) ? 'webp' : 'jpg'; }
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}
function stamp(t){ const d = new Date(t), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }

/* ================== IndexedDB（参考图 / 图库 / 任务都存这里，关掉网页也不丢） ================== */
const db = await new Promise((res, rej) => {
  const r = indexedDB.open('seedream-studio', 1);
  r.onupgradeneeded = () => { for (const s of ['refs','images','tasks']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath:'id' }); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
function store(name, mode, fn){ return new Promise((res, rej) => {
  const tx = db.transaction(name, mode); const st = tx.objectStore(name); let out;
  const r = fn(st); if (r) r.onsuccess = () => out = r.result;
  tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
}); }
const dbAll = n => store(n, 'readonly', s => s.getAll());
const dbGet = (n, id) => store(n, 'readonly', s => s.get(id));
const dbPut = (n, v) => store(n, 'readwrite', s => s.put(v));
const dbDel = (n, id) => store(n, 'readwrite', s => s.delete(id));
const dbClear = n => store(n, 'readwrite', s => s.clear());
try { navigator.storage?.persist?.(); } catch {}

/* ================== 设置（自动记忆） ================== */
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('sd2_settings') || '{}')); } catch {}
const saveS = () => localStorage.setItem('sd2_settings', JSON.stringify(S));
$('apiKey').value = localStorage.getItem('sd2_key') || '';
if (!$('apiKey').value) $('keyBox').open = true;
$('apiKey').addEventListener('input', e => localStorage.setItem('sd2_key', e.target.value.trim()));

function fillSelect(el, items, value){
  el.innerHTML = items.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
  el.value = items.some(([v]) => v === value) ? value : items[0][0];
  return el.value;
}
function refreshParamUI(){
  const m = MODELS[S.model] || MODELS[DEFAULTS.model];
  S.model = fillSelect($('model'), Object.entries(MODELS).map(([k, v]) => [k, v.label]), S.model);
  S.aspect = fillSelect($('aspect'), RATIOS, S.aspect);
  const resPref = m.res.includes(S.resolution) ? S.resolution : (m.res.includes('2K') ? '2K' : m.res[m.res.length-1]);
  S.resolution = fillSelect($('resolution'), m.res.map(r => [r, r]), resPref);
  if (m.fmt){ $('format').disabled = false; S.format = fillSelect($('format'), m.fmt.map(f => [f, f.toUpperCase()]), S.format); }
  else { $('format').disabled = true; fillSelect($('format'), [['', '该模型不支持']], ''); }
  $('background').disabled = !m.bg; $('background').value = m.bg ? S.background : 'auto';
  if (S.background === 'transparent' && m.fmt){ S.format = 'png'; $('format').value = 'png'; $('format').disabled = true; }
  $('seed').value = S.seed; $('count').value = S.count; $('concurrency').value = String(S.concurrency);
  $('autoRetry').checked = S.autoRetry; $('prompt').value = S.prompt;
  $('modelHint').textContent = `最多 ${m.maxRefs} 张参考图 · 分辨率可选 ${m.res.join(' / ')}${m.bg ? ' · 支持透明背景' : ''}`;
  saveS(); renderRefs();
}
$('model').onchange      = e => { S.model = e.target.value; refreshParamUI(); };
$('aspect').onchange     = e => { S.aspect = e.target.value; saveS(); };
$('resolution').onchange = e => { S.resolution = e.target.value; saveS(); };
$('format').onchange     = e => { S.format = e.target.value; saveS(); };
$('background').onchange = e => { S.background = e.target.value; refreshParamUI(); };
$('seed').oninput        = e => { S.seed = e.target.value; saveS(); };
$('count').oninput       = e => { S.count = Math.max(1, Math.min(50, parseInt(e.target.value) || 1)); saveS(); };
$('concurrency').onchange= e => { S.concurrency = parseInt(e.target.value); saveS(); pump(); };
$('autoRetry').onchange  = e => { S.autoRetry = e.target.checked; saveS(); };
$('prompt').oninput      = e => { S.prompt = e.target.value; saveS(); };

/* ================== 参考图（持久保存） ================== */
const urlCache = new Map();
const urlFor = (id, blob) => { if (!urlCache.has(id)) urlCache.set(id, URL.createObjectURL(blob)); return urlCache.get(id); };
const dropUrl = id => { if (urlCache.has(id)){ URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); } };

async function shrink(file){
  // 长边超过 2560 才压缩，避免请求太大；PNG 保持 PNG（保留透明）
  const MAX = 2560;
  let bmp; try { bmp = await createImageBitmap(file); } catch { return file; }
  const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size < 4e6 && /jpeg|png|webp/.test(file.type)){ bmp.close?.(); return file; }
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
  const png = file.type === 'image/png';
  return await new Promise(r => c.toBlob(b => r(b || file), png ? 'image/png' : 'image/jpeg', 0.92));
}
async function addRefBlob(blob, name){
  await dbPut('refs', { id: uid(), blob, name: name || 'ref', created: Date.now(), sel: Date.now() + Math.random() });
}
$('refFile').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) await addRefBlob(await shrink(f), f.name);
  toast(`已保存 ${files.length} 张参考图`); renderRefs();
};
async function selectedRefs(){ return (await dbAll('refs')).filter(r => r.sel).sort((a, b) => a.sel - b.sel); }
async function renderRefs(){
  const refs = (await dbAll('refs')).sort((a, b) => a.created - b.created);
  const sel = refs.filter(r => r.sel).sort((a, b) => a.sel - b.sel).map(r => r.id);
  const max = (MODELS[S.model] || {}).maxRefs || 10;
  $('refCount').textContent = `已选 ${sel.length}/${max}`;
  $('refCount').style.color = sel.length > max ? 'var(--err)' : '';
  const box = $('refs'); box.innerHTML = '';
  for (const r of refs){
    const d = document.createElement('div'); const idx = sel.indexOf(r.id);
    d.className = 'ref' + (idx >= 0 ? ' sel' : '');
    d.innerHTML = `<img src="${urlFor(r.id, r.blob)}" alt="">${idx >= 0 ? `<span class="badge">图${idx+1}</span>` : ''}<button class="del">×</button>`;
    d.onclick = async ev => {
      if (ev.target.classList.contains('del')){
        if (!confirm('删除这张参考图？')) return;
        await dbDel('refs', r.id); dropUrl(r.id); return renderRefs();
      }
      r.sel = r.sel ? 0 : Date.now(); await dbPut('refs', r); renderRefs();
    };
    box.appendChild(d);
  }
  const add = document.createElement('div'); add.className = 'ref add'; add.textContent = '+';
  add.onclick = () => $('refFile').click(); box.appendChild(add);
}
$('refNone').onclick = async () => { for (const r of await dbAll('refs')) if (r.sel){ r.sel = 0; await dbPut('refs', r); } renderRefs(); };

/* ================== 任务队列（任务存在本机，断线可续） ================== */
const active = new Map();   // taskId -> { ctrl, start, hidden, reason }
let hiddenAt = 0;

$('go').onclick = async () => {
  const key = localStorage.getItem('sd2_key');
  if (!key){ $('keyBox').open = true; return toast('先填 API Key'); }
  const prompt = $('prompt').value.trim(); if (!prompt) return toast('提示词是空的');
  const m = MODELS[S.model]; const refs = await selectedRefs();
  if (refs.length > m.maxRefs) return toast(`这个模型最多 ${m.maxRefs} 张参考图，你选了 ${refs.length} 张`);
  const params = { aspect_ratio: S.aspect, resolution: S.resolution,
    output_format: m.fmt ? S.format : null, background: m.bg ? S.background : null,
    seed: S.seed === '' ? null : parseInt(S.seed) };
  const n = S.count;
  for (let i = 0; i < n; i++){
    await dbPut('tasks', { id: uid(), created: Date.now() + i, model: S.model, prompt, params,
      refIds: refs.map(r => r.id), status: 'queued', attempts: 0, error: '' });
  }
  toast(`已加入 ${n} 个任务`); pump();
};

async function buildBody(t){
  const body = { model: t.model, prompt: t.prompt, n: 1 };
  const p = t.params;
  if (p.aspect_ratio) body.aspect_ratio = p.aspect_ratio;
  if (p.resolution) body.resolution = p.resolution;
  if (p.output_format) body.output_format = p.output_format;
  if (p.background) body.background = p.background;
  if (Number.isFinite(p.seed)) body.seed = p.seed;
  if (t.refIds.length){
    body.input_references = [];
    for (const id of t.refIds){
      const r = await dbGet('refs', id);
      if (!r) throw new ApiError('有一张参考图已被删除，这个任务没法重发', 0);
      body.input_references.push({ type: 'image_url', image_url: { url: await blobToDataURL(r.blob) } });
    }
  }
  return body;
}

async function pump(){
  const queued = (await dbAll('tasks')).filter(t => t.status === 'queued' && !active.has(t.id)).sort((a, b) => a.created - b.created);
  for (const t of queued){ if (active.size >= S.concurrency) break; runTask(t); }
  renderTasks(); updateWake();
}

async function runTask(t){
  const rec = { ctrl: new AbortController(), start: Date.now(), hidden: document.hidden, reason: '' };
  active.set(t.id, rec);
  t.status = 'running'; t.attempts = (t.attempts || 0) + 1; t.error = ''; t.startedAt = Date.now();
  await dbPut('tasks', t); renderTasks();
  let ok = false;
  try {
    const body = await buildBody(t);
    const timer = setTimeout(() => { rec.reason = '等待超时'; rec.ctrl.abort(); }, REQ_TIMEOUT);
    let resp, text;
    try {
      resp = await fetch(API, { method: 'POST', signal: rec.ctrl.signal,
        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('sd2_key'), 'Content-Type': 'application/json',
                   'HTTP-Referer': location.origin + location.pathname, 'X-Title': 'Seedream Studio' },
        body: JSON.stringify(body) });
      text = await resp.text();
    } finally { clearTimeout(timer); }
    let json = null; try { json = JSON.parse(text); } catch {}
    if (!resp.ok || json?.error) throw new ApiError(json?.error?.message || (text || '').slice(0, 300) || ('HTTP ' + resp.status), resp.status);
    const items = json?.data || [];
    if (!items.length) throw new ApiError('接口没返回图片：' + (text || '').slice(0, 200), resp.status);
    const fallbackMime = t.params.output_format === 'jpeg' ? 'image/jpeg' : 'image/png';
    for (const it of items){
      let blob;
      if (it.b64_json) blob = await b64ToBlob(it.b64_json, it.media_type || fallbackMime);
      else if (it.url) blob = await (await fetch(it.url)).blob();
      else continue;
      await dbPut('images', { id: uid(), blob, mime: blob.type || fallbackMime, prompt: t.prompt, model: t.model,
        params: t.params, refCount: t.refIds.length, created: Date.now(), cost: json.usage?.cost ?? null });
    }
    await dbDel('tasks', t.id); ok = true;
  } catch (e) {
    const cur = await dbGet('tasks', t.id);
    if (cur){
      if (e instanceof ApiError){
        cur.status = 'failed';
        cur.error = (e.status === 429 || e.status >= 500) ? `${e.message}（服务端繁忙，可点重发）` : e.message;
      } else if (rec.hidden || rec.reason){
        cur.status = 'interrupted';
        cur.error = rec.reason || '连接被中断（页面切到后台了）';
      } else {
        cur.status = 'failed';
        cur.error = '网络错误：' + (e.message || e);
      }
      await dbPut('tasks', cur);
    }
  } finally {
    active.delete(t.id);
    if (ok) renderGallery();
    if (!document.hidden) await requeueInterrupted();
    pump();
  }
}

async function requeueInterrupted(){
  if (!S.autoRetry) return;
  for (const t of await dbAll('tasks')){
    if (t.status === 'interrupted' && (t.attempts || 0) < MAX_AUTO){ t.status = 'queued'; await dbPut('tasks', t); }
  }
}

async function renderTasks(){
  const tasks = (await dbAll('tasks')).sort((a, b) => a.created - b.created);
  $('taskCard').hidden = !tasks.length;
  const label = { queued:'排队中', running:'生成中', interrupted:'已中断', failed:'失败' };
  $('tasks').innerHTML = tasks.map(t => {
    const secs = t.status === 'running' && t.startedAt ? ` ${Math.round((Date.now() - t.startedAt)/1000)}s` : '';
    return `<div class="t s-${t.status}"><span class="dot"></span>
      <span class="msg"><b>${label[t.status] || t.status}${secs}</b> · ${esc(t.error || t.prompt.slice(0, 40))}</span>
      ${t.status === 'failed' || t.status === 'interrupted' ? `<button class="small" data-retry="${t.id}">重发</button>` : ''}
      ${t.status !== 'running' ? `<button class="small danger" data-del="${t.id}">删</button>` : ''}</div>`;
  }).join('');
  const running = tasks.filter(t => t.status === 'running').length;
  const left = tasks.filter(t => t.status === 'queued' || t.status === 'running').length;
  document.title = left ? `⏳${left} Seedream` : 'Seedream 工作台';
  $('retryAll').hidden = !tasks.some(t => t.status === 'failed' || t.status === 'interrupted');
  if (running) { clearTimeout(renderTasks._t); renderTasks._t = setTimeout(renderTasks, 1000); }
}
$('tasks').onclick = async e => {
  const r = e.target.dataset.retry, d = e.target.dataset.del;
  if (r){ const t = await dbGet('tasks', r); if (t){ t.status = 'queued'; t.attempts = 0; await dbPut('tasks', t); pump(); } }
  if (d){ await dbDel('tasks', d); renderTasks(); updateWake(); }
};
$('retryAll').onclick = async () => {
  for (const t of await dbAll('tasks')) if (t.status === 'failed' || t.status === 'interrupted'){ t.status = 'queued'; t.attempts = 0; await dbPut('tasks', t); }
  pump();
};
$('clearTasks').onclick = async () => {
  for (const t of await dbAll('tasks')) if (t.status === 'failed' || t.status === 'interrupted') await dbDel('tasks', t.id);
  renderTasks();
};

/* ---- 切后台 / 切回来 ---- */
function onHide(){ hiddenAt = Date.now(); for (const r of active.values()) r.hidden = true; }
async function onShow(){
  const away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
  for (const r of active.values()){
    // iOS 切回来后，有些请求既不成功也不报错，会一直挂着；超过阈值直接放弃并重发
    if (away > 10000 && Date.now() - r.start > STALE_MS){ r.reason = '切后台太久，连接已丢，自动重发'; r.ctrl.abort(); }
  }
  await requeueInterrupted(); pump(); renderGallery();
}
document.addEventListener('visibilitychange', () => document.hidden ? onHide() : onShow());
window.addEventListener('pageshow', e => { if (e.persisted) onShow(); });

/* ---- 屏幕常亮：有任务时防止手机自动锁屏 ---- */
let wake = null;
async function updateWake(){
  const busy = active.size > 0;
  try {
    if (busy && !wake && 'wakeLock' in navigator && !document.hidden){
      wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null);
    } else if (!busy && wake){ await wake.release(); wake = null; }
  } catch {}
}

/* ================== 图库 ================== */
let galleryIds = '';
async function renderGallery(){
  const imgs = (await dbAll('images')).sort((a, b) => b.created - a.created);
  $('galCount').textContent = `${imgs.length} 张`;
  const ids = imgs.map(i => i.id).join(',');
  if (ids === galleryIds) return; galleryIds = ids;
  const g = $('gallery'); g.innerHTML = '';
  for (const im of imgs){
    const el = document.createElement('img'); el.loading = 'lazy'; el.src = urlFor(im.id, im.blob);
    el.onclick = () => openViewer(im); g.appendChild(el);
  }
}
let vCur = null;
function openViewer(im){
  vCur = im; $('vImg').src = urlFor(im.id, im.blob);
  const p = im.params || {};
  $('vMeta').textContent = `${(MODELS[im.model] || {}).label || im.model} · ${p.aspect_ratio} · ${p.resolution}${p.output_format ? ' · ' + p.output_format : ''}${p.background ? ' · bg ' + p.background : ''}${Number.isFinite(p.seed) ? ' · seed ' + p.seed : ''}${im.refCount ? ' · 参考图 ' + im.refCount + ' 张' : ''}${im.cost != null ? ' · $' + im.cost : ''}\n${new Date(im.created).toLocaleString()}\n\n${im.prompt}`;
  $('viewer').classList.add('show');
}
$('vClose').onclick = () => $('viewer').classList.remove('show');
$('vDl').onclick = () => saveBlob(vCur.blob, `seedream_${stamp(vCur.created)}.${extOf(vCur.mime)}`);
$('vShare').onclick = async () => {
  const f = new File([vCur.blob], `seedream_${stamp(vCur.created)}.${extOf(vCur.mime)}`, { type: vCur.mime });
  if (navigator.canShare?.({ files: [f] })) { try { await navigator.share({ files: [f] }); } catch {} }
  else toast('这个浏览器不支持，长按图片也可以存到相册');
};
$('vRef').onclick = async () => { await addRefBlob(vCur.blob, 'from-gallery'); renderRefs(); toast('已加到参考图并选中'); };
$('vDel').onclick = async () => {
  if (!confirm('删除这张图？')) return;
  await dbDel('images', vCur.id); dropUrl(vCur.id); $('viewer').classList.remove('show'); renderGallery();
};
$('clearGal').onclick = async () => {
  if (!confirm('清空图库里的所有图片？（建议先打包下载）')) return;
  if (!confirm('真的清空？删除后无法恢复')) return;
  for (const im of await dbAll('images')) dropUrl(im.id);
  await dbClear('images'); renderGallery();
};

/* ---- 一键打包下载（不压缩的 ZIP，图片本来就压缩过，速度最快） ---- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files, onProgress){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (let i = 0; i < files.length; i++){
    const { name, blob, time } = files[i];
    const data = new Uint8Array(await blob.arrayBuffer()); const crc = crc32(data); const nb = enc.encode(name);
    const d = new Date(time);
    const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nb, blob);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, nb);
    offset += 30 + nb.length + data.length;
    onProgress?.(i + 1, files.length);
  }
  const cdSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}
$('zipAll').onclick = async () => {
  const imgs = (await dbAll('images')).sort((a, b) => a.created - b.created);
  if (!imgs.length) return toast('图库是空的');
  const btn = $('zipAll'); btn.disabled = true;
  try {
    const used = new Set();
    const files = imgs.map(im => { let n = `seedream_${stamp(im.created)}`, k = 1, name;
      do { name = `${n}${k > 1 ? '_' + k : ''}.${extOf(im.mime)}`; k++; } while (used.has(name)); used.add(name);
      return { name, blob: im.blob, time: im.created }; });
    const zip = await makeZip(files, (i, n) => btn.textContent = `打包中 ${i}/${n}`);
    saveBlob(zip, `seedream_全部${imgs.length}张_${stamp(Date.now())}.zip`);
    toast(`已打包 ${imgs.length} 张`);
  } catch (e) { toast('打包失败：' + e.message, 4000); }
  finally { btn.disabled = false; btn.textContent = '⬇️ 一键打包下载全部'; }
};

/* ================== 启动 ================== */
// 上次关网页时还在跑的任务 → 标记为中断，按设置自动重发
for (const t of await dbAll('tasks')) if (t.status === 'running'){ t.status = 'interrupted'; t.error = '上次关闭页面时还没返回'; await dbPut('tasks', t); }
refreshParamUI();
await requeueInterrupted();
renderGallery(); pump();
})();
</script>
